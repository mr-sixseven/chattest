<!DOCTYPE html>
<html lang="en" data-theme="whatsapp">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MiniChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="themes.css"/>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <div class="avatar" id="selfAvatar">?</div>
      <div class="side-info">
        <div class="side-name" id="selfName">You</div>
        <div class="side-status" id="selfStatus">Offline</div>
      </div>
    </div>
    <div class="section">
      <div class="label">Members <span id="memberCount">0</span></div>
      <ul id="members"></ul>
    </div>
    <div class="section">
      <label class="label">Room</label>
      <input id="room" value="lobby"/>
      <label class="label">Nickname</label>
      <input id="nickname"/>
      <div class="row">
        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
      </div>
    </div>
    <div class="section">
      <label class="label">Theme</label>
      <select id="themeSelect">
        <option value="whatsapp">WhatsApp</option>
        <option value="telegram">Telegram</option>
        <option value="discord">Discord</option>
        <option value="glass">Liquid Glass</option>
      </select>
      <label class="label">Language</label>
      <select id="langSelect">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <label class="label">Font <span id="fontLabel">100%</span></label>
      <input id="fontSize" type="range" min="85" max="130" value="100" step="5"/>
    </div>
  </aside>

  <main id="chat">
    <header id="head">
      <button id="sidebarToggle">☰</button>
      <div class="avatar" id="roomAvatar">#</div>
      <div class="info">
        <div class="name" id="roomName">lobby</div>
        <div class="sub" id="roomStatus">Tap connect</div>
      </div>
      <button id="starBtn" title="Starred">⭐</button>
      <button id="searchBtn" title="Search (Ctrl+F)">🔍</button>
    </header>

    <div id="searchbar" hidden>
      <input id="searchInput" placeholder="Search…"/>
      <span id="searchCount"></span>
      <button id="searchClose">✕</button>
    </div>

    <div id="selbar" hidden>
      <button id="selClose">✕</button>
      <span class="cnt" id="selCount">0 selected</span>
      <div class="actions">
        <button id="selStar" title="Star">⭐</button>
        <button id="selCopy" title="Copy">📋</button>
        <button id="selDelete" title="Delete">🗑️</button>
      </div>
    </div>

    <div id="messages"></div>

    <button id="scrollDown" hidden>↓<span id="unread"></span></button>

    <div id="dropOverlay" hidden><div>📎 Drop to send</div></div>

    <footer id="composer">
      <div id="replyPreview" hidden>
        <div class="rp-body">
          <div class="rp-name"></div>
          <div class="rp-text"></div>
        </div>
        <button id="replyClose" type="button">✕</button>
      </div>
      <form id="composerForm">
        <button type="button" id="emojiBtn">😊</button>
        <button type="button" id="attachBtn">📎</button>
        <textarea id="text" rows="1" placeholder="Type a message…" disabled></textarea>
        <button type="button" id="audioBtn">🎤</button>
        <button type="submit" id="sendBtn" disabled>Send</button>
      </form>
      <div id="attachMenu" hidden>
        <button type="button" data-a="image">🖼️ Image</button>
        <button type="button" data-a="file">📄 Document</button>
      </div>
      <div id="mentions" hidden></div>
    </footer>
  </main>
</div>

<div id="ctx" hidden></div>
<div id="emojiPicker" hidden></div>
<div id="lightbox" hidden><img id="lightboxImg" alt=""/></div>
<div id="toasts"></div>
<input id="imageInput" type="file" accept="image/*" hidden/>
<input id="fileInput" type="file" hidden/>

<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<script src="chat.js"></script>
</body>
</html>
