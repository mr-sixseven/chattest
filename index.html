<!DOCTYPE html>
<html lang="en" data-theme="whatsapp">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MiniChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#202c33"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="MiniChat"/>
<link rel="stylesheet" href="themes.css"/>
</head>
<body>

<!-- ============ JOIN SCREEN ============ -->
<div id="joinScreen">
  <div class="join-card">
    <div class="join-brand">
      <div class="join-logo">💬</div>
      <h1>MiniChat</h1>
      <p class="join-sub">Join a room to start chatting</p>
    </div>

    <div class="join-avatar-row">
      <div class="avatar lg" id="joinAvatar">?</div>
      <div class="join-avatar-btns">
        <button type="button" id="joinAvatarPick" data-i18n="pickPicture">📷 Picture</button>
        <button type="button" id="joinAvatarClear" data-i18n="removeAvatar" hidden>Remove</button>
      </div>
    </div>

    <label class="join-label" for="joinRoom" data-i18n="room">Room</label>
    <input id="joinRoom" value="lobby" maxlength="32" autocomplete="off"/>

    <label class="join-label" for="joinNick" data-i18n="nickname">Nickname</label>
    <input id="joinNick" maxlength="32" autocomplete="off" placeholder="anon"/>

    <button id="joinBtn" class="join-go" data-i18n="joinRoom">Join room</button>
  </div>
</div>

<!-- ============ CROP VIEWFINDER ============ -->
<div id="cropView" hidden>
  <div class="crop-card">
    <h2 data-i18n="cropTitle">Crop your picture</h2>
    <div class="crop-stage" id="cropStage">
      <canvas id="cropCanvas" width="240" height="240"></canvas>
      <div class="crop-ring"></div>
    </div>
    <div class="crop-controls">
      <label class="crop-zoom">
        <span data-i18n="zoom">Zoom</span>
        <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1"/>
      </label>
      <div class="crop-actions">
        <button type="button" id="cropCancel" data-i18n="cancel">Cancel</button>
        <button type="button" id="cropOk" data-i18n="usePicture">Use picture</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <div class="avatar" id="selfAvatar" title="📷">?</div>
      <div class="side-info">
        <div class="side-name" id="selfName">You</div>
        <div class="side-status"><span class="conn-dot" id="connDot"></span><span id="selfStatus">Offline</span></div>
      </div>
    </div>

    <details class="sec" id="secConn" open>
      <summary><span data-i18n="connection">Connection</span></summary>
      <div class="sec-body">
        <label class="field"><span class="field-lbl" data-i18n="room">Room</span>
          <input id="room" value="lobby" maxlength="32" autocomplete="off"/></label>
        <label class="field"><span class="field-lbl" data-i18n="nickname">Nickname</span>
          <input id="nickname" maxlength="32" autocomplete="off"/></label>
        <div class="row">
          <button id="connectBtn" data-i18n="connect">Connect</button>
          <button id="disconnectBtn" class="secondary" data-i18n="disconnect" disabled>Disconnect</button>
        </div>
      </div>
    </details>

    <details class="sec" id="secMembers" open>
      <summary><span data-i18n="members">Members</span><span class="count" id="memberCount">0</span></summary>
      <div class="sec-body"><ul id="members"></ul></div>
    </details>

    <details class="sec" id="bansSection" open hidden>
      <summary><span data-i18n="bans">Bans</span><span class="count" id="banCount">0</span></summary>
      <div class="sec-body"><ul id="bans"></ul></div>
    </details>

    <details class="sec" id="secProfile">
      <summary><span data-i18n="profile">Profile</span></summary>
      <div class="sec-body">
        <div class="row">
          <button id="changeAvatar" class="secondary" data-i18n="changeAvatar">📷 Picture</button>
          <button id="removeAvatar" class="secondary" data-i18n="removeAvatar" hidden>Remove</button>
        </div>
      </div>
    </details>

    <details class="sec" id="secHistory">
      <summary><span data-i18n="history">History</span></summary>
      <div class="sec-body">
        <div class="row">
          <button id="exportJson" class="secondary" data-i18n="exportJson">JSON</button>
          <button id="exportTxt" class="secondary" data-i18n="exportTxt">TXT</button>
          <button id="importBtn" class="secondary" data-i18n="import">Import</button>
        </div>
        <button id="clearHist" class="danger" data-i18n="clearHist">Clear history</button>
      </div>
    </details>

    <details class="sec" id="secLook">
      <summary><span data-i18n="appearance">Appearance</span></summary>
      <div class="sec-body">
        <label class="field"><span class="field-lbl" data-i18n="theme">Theme</span>
          <select id="themeSelect">
            <option value="whatsapp">WhatsApp</option>
            <option value="telegram">Telegram</option>
            <option value="discord">Discord</option>
            <option value="glass">Liquid Glass</option>
          </select></label>
        <label class="field"><span class="field-lbl" data-i18n="language">Language</span>
          <select id="langSelect">
            <option value="en">English</option>
            <option value="es">Español</option>
          </select></label>
        <label class="field"><span class="field-lbl"><span data-i18n="font">Font</span><span id="fontLabel">100%</span></span>
          <input id="fontSize" type="range" min="85" max="130" value="100" step="5"/></label>
        <button id="installBtn" class="secondary" data-i18n="installApp" hidden>📲 Install app</button>
      </div>
    </details>
  </aside>

  <main id="chat">
    <header id="head">
      <button id="sidebarToggle">☰</button>
      <div class="avatar" id="roomAvatar">#</div>
      <div class="info">
        <div class="name" id="roomName">lobby</div>
        <div class="sub" id="roomStatus">Tap connect</div>
      </div>
      <button id="starBtn" title="Starred">⭐</button>
      <button id="searchBtn" title="Search (Ctrl+F)">🔍</button>
    </header>

    <div id="searchbar" hidden>
      <input id="searchInput" placeholder="Search…" data-i18n-ph="searchPh"/>
      <span id="searchCount"></span>
      <button id="searchClose">✕</button>
    </div>

    <div id="selbar" hidden>
      <button id="selClose">✕</button>
      <span class="cnt" id="selCount">0 selected</span>
      <div class="actions">
        <button id="selStar" title="Star">⭐</button>
        <button id="selCopy" title="Copy">📋</button>
        <button id="selDelete" title="Delete">🗑️</button>
      </div>
    </div>

    <div id="messages"></div>

    <button id="scrollDown" hidden>↓<span id="unread"></span></button>

    <div id="dropOverlay" hidden><div>📎 Drop to send</div></div>

    <footer id="composer">
      <div id="replyPreview" hidden>
        <div class="rp-body">
          <div class="rp-name"></div>
          <div class="rp-text"></div>
        </div>
        <button id="replyClose" type="button">✕</button>
      </div>
      <form id="composerForm">
        <button type="button" id="emojiBtn">😊</button>
        <button type="button" id="attachBtn">📎</button>
        <textarea id="text" rows="1" placeholder="Type a message…" data-i18n-ph="typeMsg" disabled></textarea>
        <button type="button" id="audioBtn">🎤</button>
        <button type="submit" id="sendBtn" disabled>Send</button>
      </form>
      <div id="attachMenu" hidden>
        <button type="button" data-a="image">🖼️ <span data-i18n="image">Image</span></button>
        <button type="button" data-a="sticker">🌟 <span data-i18n="sticker">Sticker</span></button>
        <button type="button" data-a="file">📄 <span data-i18n="file">Document</span></button>
        <button type="button" data-a="app">🧩 <span data-i18n="miniApps">Mini apps</span></button>
      </div>
      <div id="mentions" hidden></div>
    </footer>
  </main>
</div>

<div id="appDialog" hidden>
  <div class="app-card" role="dialog" aria-modal="true">
    <div class="app-head">
      <h2 data-i18n="miniApps">Mini apps</h2>
      <button type="button" id="appClose" aria-label="Close">✕</button>
    </div>
    <div class="app-tabs" id="appTabs">
      <button type="button" data-app="stopwatch">⏱️ <span data-i18n="appStopwatch">Stopwatch</span></button>
      <button type="button" data-app="timer">⏲️ <span data-i18n="appTimer">Timer</span></button>
      <button type="button" data-app="countdown">📅 <span data-i18n="appCountdown">Countdown</span></button>
      <button type="button" data-app="clock">🕒 <span data-i18n="appClock">Clock</span></button>
      <button type="button" data-app="poll">📊 <span data-i18n="appPoll">Poll</span></button>
      <button type="button" data-app="custom">🧩 <span data-i18n="appCustom">Custom HTML</span></button>
    </div>
    <div id="appFormBox"></div>
    <div id="appPreview"></div>
    <div class="app-actions">
      <button type="button" id="appPreviewBtn" class="secondary" data-i18n="appPreview" hidden>Preview</button>
      <button type="button" id="appSend" data-i18n="appSend">Send to chat</button>
    </div>
  </div>
</div>
<div id="ctx" hidden></div>
<div id="emojiPicker" hidden></div>
<div id="lightbox" hidden><img id="lightboxImg" alt=""/></div>
<div id="toasts"></div>

<input id="imageInput" type="file" accept="image/*" hidden/>
<input id="stickerInput" type="file" accept="image/*" hidden/>
<input id="fileInput" type="file" hidden/>
<input id="importInput" type="file" accept=".json,application/json" hidden/>
<input id="avatarChangeInput" type="file" accept="image/*" hidden/>
<input id="joinAvatarInput" type="file" accept="image/*" hidden/>

<script>
// Load the MQTT library (trying a few CDNs in case one is blocked or down), then start the chat.
(function(){
  var urls=[
    'https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js',
    'https://cdn.jsdelivr.net/npm/mqtt@5.3.5/dist/mqtt.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.5/mqtt.min.js'
  ];
  function boot(){var s=document.createElement('script');s.src='chat.js';document.body.appendChild(s)}
  function load(i){
    if(typeof mqtt!=='undefined'||i>=urls.length)return boot();
    var s=document.createElement('script');
    s.src=urls[i];
    s.onload=function(){typeof mqtt!=='undefined'?boot():load(i+1)};
    s.onerror=function(){load(i+1)};
    document.body.appendChild(s);
  }
  load(0);
})();
</script>
</body>
</html>
